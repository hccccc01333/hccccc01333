<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Rainfun · Sword and Sorcery</title>
  <desc id="desc">An original Japanese fantasy adventure banner with enchanted swords, arcane circles, runes, a moon and data science lettering.</desc>
  <defs>
    <linearGradient id="sky" x1="90" y1="0" x2="1060" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101735"/>
      <stop offset="0.48" stop-color="#251D4C"/>
      <stop offset="1" stop-color="#6B315F"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="210" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#11162E"/>
      <stop offset="0.55" stop-color="#17162D"/>
      <stop offset="1" stop-color="#090D1B"/>
    </linearGradient>
    <linearGradient id="gold" x1="790" y1="72" x2="1080" y2="246" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF1B8"/>
      <stop offset="0.55" stop-color="#F4C76B"/>
      <stop offset="1" stop-color="#D77D5E"/>
    </linearGradient>
    <linearGradient id="magic" x1="760" y1="95" x2="1070" y2="274" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8CF2FF"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#FF91C8"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0" cy="0" r="1" gradientTransform="translate(965 70) rotate(90) scale(125)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF6D0" stop-opacity="0.33"/>
      <stop offset="1" stop-color="#FFF6D0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="stars" width="110" height="82" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="17" r="1" fill="#FFF6D0" fill-opacity="0.75"/>
      <circle cx="68" cy="48" r="1.4" fill="#B5E8FF" fill-opacity="0.65"/>
      <circle cx="96" cy="9" r="0.8" fill="#FFF6D0" fill-opacity="0.65"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="moonBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <style>
      .serif { font-family: Georgia, "Times New Roman", "Noto Serif CJK SC", serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .magic-spin { transform-origin: 925px 183px; animation: spin 24s linear infinite; }
      .magic-spin-reverse { transform-origin: 925px 183px; animation: spin-reverse 32s linear infinite; }
      .magic-spin-left { transform-origin: 270px 176px; animation: spin 36s linear infinite; }
      .spark { animation: twinkle 2.5s ease-in-out infinite; }
      .spark-delay { animation: twinkle 3.3s ease-in-out 1s infinite; }
      .sword-shine { animation: shine 4.5s ease-in-out infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes spin-reverse { to { transform: rotate(-360deg); } }
      @keyframes twinkle { 0%, 100% { opacity: .25; transform: scale(.65); } 50% { opacity: 1; transform: scale(1.4); } }
      @keyframes shine { 0%, 75%, 100% { opacity: 0; transform: translateX(-28px); } 84% { opacity: .8; } 92% { opacity: 0; transform: translateX(90px); } }
    </style>
  </defs>

